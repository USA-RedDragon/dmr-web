version: "2"

run:
  timeout: 30m

linters:
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - dogsled
          - goconst
          - gosec
      - path: ambe/module_js\.go
        text: G115
        linters:
          - gosec
  settings:
    goheader:
      template-path: .copyright-header
    exhaustive:
      default-signifies-exhaustive: true
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goheader
    - gomoddirectives
    - gosec
    - grouper
    - loggercheck
    - misspell
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - reassign
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck

formatters:
  enable:
    - gci
    - gofmt
